
name: Build Koresh APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
         packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download offline Russian wake-word model
        run: |
          curl -fL --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -o /tmp/vosk.zip
          unzip -q /tmp/vosk.zip -d /tmp/vosk
          mkdir -p app/src/main/assets/model
          cp -R /tmp/vosk/vosk-model-small-ru-0.22/. app/src/main/assets/model/

      - name: Build APK
        run: gradle assembleDebug --no-daemon --info --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Koresh-Microphone
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
