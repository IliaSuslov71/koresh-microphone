
name: Build Koresh APK

on:
  workflow_dispatch:
  push:
    branches:
      - koresh-2.1-sherpa

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
         packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download offline Russian wake-word model
        run: |
          curl -fL --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -o /tmp/vosk.zip
          unzip -q /tmp/vosk.zip -d /tmp/vosk
          mkdir -p app/src/main/assets/model
          cp -R /tmp/vosk/vosk-model-small-ru-0.22/. app/src/main/assets/model/

      - name: Download Russian sherpa-onnx model
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-small-zipformer-ru-2024-09-18.tar.bz2 -o /tmp/sherpa-model.tar.bz2
          mkdir -p app/src/main/assets
          tar -xjf /tmp/sherpa-model.tar.bz2 -C app/src/main/assets \
            sherpa-onnx-small-zipformer-ru-2024-09-18/encoder.int8.onnx \
            sherpa-onnx-small-zipformer-ru-2024-09-18/decoder.onnx \
            sherpa-onnx-small-zipformer-ru-2024-09-18/joiner.int8.onnx \
            sherpa-onnx-small-zipformer-ru-2024-09-18/tokens.txt

      - name: Build APK
        run: gradle assembleDebug --no-daemon --info --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Koresh-Microphone
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
